<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lenochod</title>
<meta name="theme-color" content="#FBF3E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" as="image" href="img/hero.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: warm cream phone app. Brand row, greeting + today ring, sloth banner fading into the page, content cards, fixed tab bar with orange active state. */
:root{
  --bg:#FBF3E6; --card:#FFFDF8; --sunk:#F3E8D6; --ink:#1F2B4D; --muted:#7A7468; --line:#EADFCB;
  --orange:#EFA23A; --orange-d:#D9852A; --orange-soft:#FCE9C8; --olive:#8FA05A; --olive-d:#6F7F42; --olive-soft:#E6ECD3;
  --rose:#F3C3B6; --rose-soft:#FBE7E1; --lock:#BDB4A4;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1B1A24; --card:#252432; --sunk:#2E2C3B; --ink:#F5EEDF; --muted:#ACA493; --line:#3A3848;
  --orange:#F2AD4C; --orange-d:#F7C27A; --orange-soft:#3D3122; --olive:#A6B871; --olive-d:#C3D28F; --olive-soft:#2D3424;
  --rose:#7A4B42; --rose-soft:#352625; --lock:#5E5A69;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img,svg{max-width:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* brand + hero */
.top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.brand{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink);display:flex;align-items:center;gap:4px;line-height:1}
.logo svg{width:24px;height:24px;transform:translateY(-6px)}
.tagline{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:3px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:560px;margin:16px auto 0}
.hero h1{font-size:38px;font-weight:700}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:15px;max-width:22ch}
.ringcard{position:relative;width:118px;height:118px;flex-shrink:0}
.ringcard svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringcard .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcard small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.ringcard b{font-family:var(--display);font-size:32px;line-height:1;font-weight:700}
.ringcard span{font-size:11px;color:var(--muted);font-weight:700}
.banner{position:relative;max-width:560px;margin:4px auto 0;height:250px;overflow:hidden}
.banner .masc{position:absolute;inset:0}
.banner .masc img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 70%,transparent 100%),linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 70%,transparent 100%),linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-composite:intersect}
:root[data-theme="dark"] .banner .masc img{filter:brightness(.82) saturate(.95)}
.bubble{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:30px;background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;font-size:13px;font-weight:800;max-width:180px;box-shadow:0 8px 24px rgba(120,80,30,.16);display:flex;gap:8px;align-items:flex-start;z-index:1}
.bubble i{font-style:normal;font-size:16px;line-height:1.1}
.streakchip{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:30px;background:var(--card);border-radius:18px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(120,80,30,.16);z-index:1}
.streakchip svg{width:26px;height:26px}
.streakchip b{font-family:var(--display);font-size:24px;line-height:1;font-weight:700}
.streakchip span{display:block;font-size:11px;color:var(--muted);font-weight:800;line-height:1.1}
.masc{display:block;position:relative}
.masc img{display:block;width:100%;height:auto;user-select:none}
.gold-leaf{position:absolute;right:8%;top:6%;width:22%;max-width:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.sheet{position:relative;margin-top:-6px}

/* small pills */
.pill-row{display:flex;gap:10px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.pill b{font-family:var(--display);font-size:24px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.pill span{font-size:12px;color:var(--muted);font-weight:700;line-height:1.15}
.pill svg{width:26px;height:26px;flex-shrink:0}

.daynav{display:flex;align-items:center;gap:8px}
.daynav button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.daynav button:disabled{opacity:.3}
.daynav .lbl{flex:1;font-family:var(--display);font-size:24px;font-weight:600}
.daynav .lbl small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:6px}

/* week chain */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px;position:relative}
.wd{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);position:relative;z-index:1}
.wd i{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--card)}
.wd i svg{width:18px;height:18px}
.wd.on i{background:var(--orange);border-color:var(--orange)}
.wd.today i{box-shadow:0 0 0 4px var(--orange-soft)}
.wd.cur{color:var(--ink)}
.wd.cur i{border-color:var(--ink)}
.wd.on.cur i{border-color:var(--orange);box-shadow:0 0 0 2px var(--ink)}
.wd.off{opacity:.45}
button.wd{padding:0;width:100%}
.tasks{transition:box-shadow .4s}
.tasks.hl{box-shadow:0 0 0 4px var(--orange)}

.quote{background:var(--olive-soft);border-radius:20px;padding:14px 16px;font-weight:700;display:flex;gap:12px;align-items:center;font-style:italic}
.quote .qi{font-size:26px;font-style:normal}
.quote small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-d);font-weight:800;margin-bottom:2px;font-style:normal}

/* cards + tasks */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 0 rgba(150,110,50,.05)}
.tasks{padding:6px 0}
.tasks h2{font-size:22px;padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.tasks h2 span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:800}
.task{border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.trow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.ticon{width:44px;height:44px;border-radius:50%;background:var(--orange-soft);display:grid;place-items:center;flex-shrink:0;font-size:21px}
.task:nth-of-type(3n+2) .ticon{background:var(--olive-soft)}
.task:nth-of-type(3n) .ticon{background:var(--rose-soft)}
.tmain{flex:1;min-width:0}
.tmain h3{font-family:var(--body);font-size:16px;font-weight:800}
.tmain p{margin:1px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-d);margin-left:5px}
.check{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:transform .15s,background .2s,border-color .2s;background:var(--card)}
.check svg{opacity:0;width:22px;height:22px;transition:opacity .2s}
.check.on{background:var(--olive);border-color:var(--olive)}
.check.on svg{opacity:1}
.check:active{transform:scale(.86)}
.tbody{padding:0 16px 14px 72px;display:flex;flex-direction:column;gap:8px}
@media (max-width:400px){.tbody{padding-left:16px}}
.tbody label{font-size:13px;font-weight:800;color:var(--muted)}
.tbody input,.tbody textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;font-size:15px}
.tbody textarea{min-height:68px;resize:vertical}
.more{font-size:13px;font-weight:800;color:var(--orange-d);padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.on{background:var(--orange-soft);border-color:var(--orange)}

/* gestures */
.gest{padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,var(--rose-soft),var(--card) 70%);border-color:var(--rose)}
.gest.done{border-color:var(--olive)}
.gtop{display:flex;gap:12px;align-items:flex-start}
.gic{font-size:24px;line-height:1;width:46px;height:46px;border-radius:50%;background:var(--rose);display:grid;place-items:center;flex-shrink:0}
.gest small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:3px}
.gest h3{font-family:var(--body);font-size:17px;font-weight:800;line-height:1.3}
.gest p{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.gest .bar i{background:#E58C77}
.gest textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;min-height:64px;resize:vertical}

/* next unlock */
.next{display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px dashed var(--line);border-radius:22px}
.next .lk{width:46px;height:46px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.next b{display:block;font-weight:800}
.next span{font-size:13px;color:var(--muted);font-weight:600}

/* page header for sub views */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(16px + env(safe-area-inset-top,0px));max-width:560px;margin:0 auto}
.phead h2{font-size:34px;font-weight:700}
.phead p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.phead .masc{width:104px;flex-shrink:0;border-radius:24px;overflow:hidden}
h2.sec{font-size:24px}

/* path */
.path{position:relative;display:flex;flex-direction:column;gap:20px;padding:6px 0}
.path::before{content:"";position:absolute;left:30px;top:30px;bottom:30px;border-left:4px dotted var(--line)}
.node{display:flex;gap:14px;align-items:flex-start;position:relative}
.dot{width:60px;height:60px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;background:var(--sunk);color:var(--lock);border:4px solid var(--bg);z-index:1;overflow:hidden}
.dot .masc{width:100%;height:100%}
.dot .masc img{width:100%;height:100%;object-fit:cover}
.node.active .dot{box-shadow:0 0 0 3px var(--orange),0 0 0 9px var(--orange-soft)}
.node.done .dot{background:var(--olive);color:#fff}
.nc{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.nc h3{font-size:20px}
.node.locked h3{color:var(--muted)}
.nc .why{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.ms{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ms.met{border-color:var(--orange);background:var(--orange-soft)}
.mtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800}
.mtop span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--orange);transition:width .4s}
.rw{display:flex;align-items:center;gap:8px}
.rw input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:700;padding:4px 0}
.node.locked .ms{opacity:.55}

/* calendar */
.cal{padding:16px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calh h3{text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.calg .h{font-size:12px;font-weight:800;color:var(--muted)}
.cd{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.cd.walk{background:var(--olive);color:#fff}
.cd.some{box-shadow:inset 0 0 0 2.5px var(--olive)}
.cd.today{background:var(--orange);color:#fff}
.cd.fut{color:var(--lock)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:700;margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* stats */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding:10px 4px 0}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol i{width:100%;max-width:28px;border-radius:10px 10px 6px 6px;background:var(--orange);min-height:4px}
.bcol i.zero{background:var(--sunk)}
.bcol span{font-size:12px;font-weight:800;color:var(--muted)}
.bcol b{font-size:12px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.arow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow div{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.arow:nth-child(3n+2) .bar i{background:var(--olive)}

/* rewards / diary / level */
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard.met{border-color:var(--orange);background:var(--orange-soft)}
.rcard.lockd{opacity:.6}
.rcard b{font-size:14px}
.rcard span{font-size:13px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.diary{display:flex;flex-direction:column;gap:10px}
.dentry{padding:12px 14px}
.dentry small{font-weight:800;color:var(--muted)}
.dentry ul{margin:6px 0 0;padding-left:18px}
.level{display:flex;gap:14px;align-items:center;padding:14px}
.level .m{width:72px;height:72px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--orange-soft)}
.level .m .masc img{width:100%;height:100%;object-fit:cover}
.level h3{font-size:22px}
.level p{margin:2px 0 6px;color:var(--muted);font-weight:700;font-size:14px}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 24px;overflow:hidden}
.timer .tm{width:100%;max-height:220px;overflow:hidden}
.timer .tm img{width:100%;height:220px;object-fit:cover;object-position:50% 30%}
.timer h3{font-size:24px;margin:0 0 4px}
.ring{position:relative;width:200px;max-width:100%;aspect-ratio:1;margin-top:0;background:var(--card);border-radius:50%;box-shadow:0 8px 24px rgba(120,80,30,.18)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .t small{font-family:var(--body);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px}
.seg button.on{background:var(--orange);color:#fff}
.play{width:68px;height:68px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 6px 16px rgba(239,162,58,.4)}

/* buttons, rows, switches */
.btn{background:linear-gradient(180deg,#F5B654,var(--orange));color:#fff;border-radius:999px;padding:15px 20px;font-weight:800;font-size:17px;width:100%;box-shadow:0 6px 16px rgba(239,162,58,.35);text-align:center}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-weight:800}
.row span{font-size:13px;color:var(--muted);font-weight:600;display:block}
.sw{width:52px;height:30px;border-radius:99px;background:var(--sunk);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--orange)}
.sw.on::after{transform:translateX(22px)}
.note{font-size:13px;color:var(--muted);font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5;box-shadow:0 -6px 20px rgba(120,80,30,.06)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:6px 0;max-width:90px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--orange-d)}
nav.tabs button.on::after{content:"";position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
nav.tabs button.lockd{opacity:.45}

/* celebration */
.cel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:var(--bg);text-align:center;overflow-y:auto}
.cel h1{font-size:54px;font-weight:700;color:var(--orange-d);transform:rotate(-4deg);margin-top:8px}
.cel .head{font-weight:800;font-size:18px}
.cel .cm{width:min(300px,80%);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(120,80,30,.18)}
.cel .streak{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.cel .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:4px}
.cel .box small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.cel .box b{font-size:19px;font-family:var(--display);font-weight:600}
.cel .btn{max-width:360px;margin-top:4px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21;max-width:none}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

/* webový přehled na široké obrazovce */
#side{display:none}
.tiles4{grid-template-columns:repeat(4,1fr)}
.rgrid3{grid-template-columns:repeat(3,1fr)}
@media (min-width:960px){
  body.wide #shell{display:grid;grid-template-columns:430px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:0 24px;align-items:start}
  body.wide main{position:sticky;top:0;border-right:1px solid var(--line)}
  body.wide #side{display:block;padding:28px 0 60px}
  body.wide nav.tabs{left:auto;right:auto;width:430px;margin-left:calc((100vw - 1240px)/2 + 24px);max-width:calc(100vw - 48px)}
  @media (max-width:1288px){body.wide nav.tabs{margin-left:24px}}
  .dash{display:flex;flex-direction:column;gap:16px}
  .dash-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="shell"><main id="app"></main><aside id="side" hidden aria-label="Přehled"></aside></div>
<nav class="tabs" id="tabs" aria-label="Navigace"></nav>
<div class="cel" id="cel" hidden></div>
<canvas id="confetti" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="cloud.js"></script>
<script src="mascot.js"></script>
<script src="app.js"></script>
</body>
</html>
